
services:
  postgres:
    image: postgres:17
    container_name: roommitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roommitra
      POSTGRES_USER: roommitra_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommitra_user -d roommitra"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: rustfs/rustfs:latest
    container_name: roommitra-storage
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in the root .env file}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in the root .env file}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

volumes:
  postgres_data:
  storage_data:
